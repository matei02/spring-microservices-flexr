plugins {
	id 'java'
	id 'org.springframework.boot' version '3.1.8' // Match your version
	id 'io.spring.dependency-management' version '1.1.4' // Match your version
}

group = 'flexr'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17) // Match your version
	}
}

repositories {
	mavenCentral()
}

ext {
	// Consistent Spring Cloud version matching the BOM
	set('springCloudVersion', "2022.0.4")
}

dependencies {
//	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	// Optional: For development convenience
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Standard testing dependency
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

dependencyManagement {
	imports {
		// Import the Spring Cloud BOM to manage dependency versions
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

//sonarqube {
//	skipProject = true
//}

tasks.named('test') {
	useJUnitPlatform()
}